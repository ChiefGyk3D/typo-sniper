[project]
name = "typo-sniper"
description = "Advanced domain typosquatting detection and monitoring"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "chiefgyk3d" }]
requires-python = ">=3.10"
dynamic = ["version"]
keywords = ["security", "typosquatting", "dns", "threat-intelligence", "osint"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/ChiefGyk3D/typo-sniper"
Issues = "https://github.com/ChiefGyk3D/typo-sniper/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.9",
]

# AI providers. Each is optional and imported lazily; the scanner's detection
# and risk scoring are deterministic and run identically with none installed.
claude = ["anthropic>=0.40.0"]
openai = ["openai>=1.50.0"]
gemini = ["google-genai>=1.0.0"]
# ollama needs no SDK: it is plain HTTP to a daemon you run
ai-all = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "google-genai>=1.0.0",
]

# Secrets backends. Doppler and HashiCorp Vault need nothing installed — both
# are reached over HTTPS with the standard library — so they are absent here.
aws = ["boto3>=1.35.0"]
azure = ["azure-keyvault-secrets>=4.8.0", "azure-identity>=1.17.0"]
gcp = ["google-cloud-secret-manager>=2.20.0"]
# onepassword uses the `op` CLI rather than a Python package
secrets-all = [
    "boto3>=1.35.0",
    "azure-keyvault-secrets>=4.8.0",
    "azure-identity>=1.17.0",
    "google-cloud-secret-manager>=2.20.0",
]

all = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "google-genai>=1.0.0",
    "boto3>=1.35.0",
    "azure-keyvault-secrets>=4.8.0",
    "azure-identity>=1.17.0",
    "google-cloud-secret-manager>=2.20.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
    "allow_network: test may open real network connections (rare; prefer stubs)",
]
filterwarnings = [
    "error::DeprecationWarning:src.*",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "B",    # bugbear
    "I",    # import sorting
    "UP",   # pyupgrade
    "S",    # bandit security checks
    "C4",   # comprehensions
    "RUF",  # ruff-specific
]
ignore = [
    "E501",    # line length is handled by the formatter
    "S101",    # assert is fine in tests
    "B008",    # function call in default argument
    "RUF012",  # mutable class attrs need ClassVar annotation
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
# The confusable-character table is deliberately built from characters that
# look like ASCII; flagging them as ambiguous defeats the module's purpose.
"src/enhanced_detection.py" = ["RUF001", "RUF002", "RUF003"]
"tests/unit/test_enhanced_detection.py" = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["cache", "config", "enhanced_detection", "exporters", "scanner", "secrets_manager", "threat_intelligence", "utils", "version"]
