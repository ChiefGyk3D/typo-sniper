# CodeQL, gitleaks, pip-audit over the pinned dependencies, and dependency
# review on pull requests. The jobs live in ChiefGyk3D/git-your-ship-together.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so newly disclosed advisories in pinned dependencies surface
    # without waiting for the next commit
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/security.yml@d57b0b6b08b84c68b5c33d5198e83eed8030c455 # v1.1.0
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      id-token: write
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}   # optional Service Token fallback; unset means OIDC only
    with:
      # The test suite deliberately contains attack payloads as fixtures
      # (script tags, javascript: URLs, spreadsheet formulas) so that the
      # exporters can be proven to neutralise them. Scanning them as if
      # they were production code produces only false positives.
      codeql-config: |
        paths-ignore:
          - tests/
      pip-audit-requirements: requirements.txt
      doppler-project: ci
      doppler-config: ci
      doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
