name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so newly disclosed advisories in pinned dependencies surface
    # without waiting for the next commit
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit pinned dependencies
        run: pip-audit --requirement requirements.txt --strict

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended
          # The test suite deliberately contains attack payloads as fixtures
          # (script tags, javascript: URLs, spreadsheet formulas) so that the
          # exporters can be proven to neutralise them. Scanning them as if
          # they were production code produces only false positives.
          config: |
            paths-ignore:
              - tests/

      - uses: github/codeql-action/analyze@v3
