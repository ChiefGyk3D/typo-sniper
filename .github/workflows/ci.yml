# Lint, tests on Python 3.10-3.13, CLI smoke test, example-config load check,
# Docker build. The jobs live in ChiefGyk3D/git-your-ship-together; this file only
# says what is specific to Typo Sniper.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/python-ci.yml@38f1c486833c7f572502b134e950913cc92d044c # v1.1.1
    permissions:
      contents: read
      id-token: write   # Doppler OIDC (see the reusable workflow's README)
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}   # optional Service Token fallback; unset means OIDC only
    with:
      python-versions: '["3.10", "3.11", "3.12", "3.13"]'
      coverage-python-version: "3.13"
      install-command: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
      test-command: pytest --cov=src --cov-report=term-missing --cov-report=xml
      # Take the pin from requirements-dev.txt so local lint and CI lint can
      # never disagree about the ruff version. Formatting stays advisory.
      lint-install-command: pip install "$(grep -E '^ruff==' requirements-dev.txt)"
      lint-command: |
        ruff check src/ tests/
        ruff format --check --diff src/ tests/ || echo "::warning title=ruff format::formatting drift (advisory)"
      smoke-command: |
        python -m typo_sniper --version
        python -m typo_sniper --help
        typo-sniper --version
        python -c "
        from typo_sniper.config import Config
        cfg = Config.from_file(__import__('pathlib').Path('config.yaml.example'))
        assert '~' not in str(cfg.cache_dir), cfg.cache_dir
        print('config.yaml.example loads cleanly')
        "
      dockerfile: docker/Dockerfile
      docker-test-command: |
        docker run --rm "$IMAGE" --version
        test "$(docker run --rm --entrypoint id "$IMAGE" -u)" != "0"
      egress-policy: block
      allowed-endpoints: |
        api.doppler.com:443
        api.github.com:443
        auth.docker.io:443
        cli.codecov.io:443
        d3fo0g5hm7lbuv.cloudfront.net:443
        deb.debian.org:80
        files.pythonhosted.org:443
        ghcr.io:443
        github.com:443
        ingest.codecov.io:443
        keybase.io:443
        packagecloud.io:443
        pkg-containers.githubusercontent.com:443
        production.cloudfront.docker.com:443
        pypi.org:443
        raw.githubusercontent.com:443
        registry-1.docker.io:443
        registry.npmjs.org:443
        release-assets.githubusercontent.com:443
        storage.googleapis.com:443
        *.actions.githubusercontent.com:443
        *.blob.core.windows.net:443
        *.githubapp.com:443
      doppler-project: ci
      doppler-config: ci
      doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
