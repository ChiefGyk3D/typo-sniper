name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      # Take the pin from requirements-dev.txt so local lint and CI lint can
      # never disagree about the ruff version.
      - name: Install ruff
        run: pip install "$(grep -E '^ruff==' requirements-dev.txt)"

      - name: Lint
        run: ruff check src/ tests/

      - name: Check formatting
        run: ruff format --check --diff src/ tests/
        continue-on-error: true

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  smoke:
    name: CLI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Install the package
        run: pip install .

      - name: CLI responds
        run: |
          python -m typo_sniper --version
          python -m typo_sniper --help
          typo-sniper --version

      - name: Example config is loadable
        run: |
          python -c "
          from typo_sniper.config import Config
          cfg = Config.from_file(__import__('pathlib').Path('config.yaml.example'))
          assert '~' not in str(cfg.cache_dir), cfg.cache_dir
          print('config.yaml.example loads cleanly')
          "

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: typo-sniper:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image runs and is unprivileged
        run: |
          docker run --rm typo-sniper:ci --version
          test "$(docker run --rm --entrypoint id typo-sniper:ci -u)" != "0"
