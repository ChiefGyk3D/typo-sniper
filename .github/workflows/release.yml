# Publishes on a version tag: a distribution to PyPI and a signed, multi-arch
# container image to GHCR with an SBOM and build provenance.
#
# PyPI publishing uses Trusted Publishing (OIDC) rather than a stored API
# token. The container job is ChiefGyk3D/git-your-ship-together' release workflow:
# cosign keyless signature, syft SPDX SBOM attached as an attestation, and a
# GitHub Artifact Attestation, all from the job's own OIDC identity. There is
# no long-lived credential in this repository's secrets to leak.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish, rather than only building'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Verify the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # A tag that disagrees with the version in the code would publish an
          # artifact nobody can trace back to a commit.
          tag="${GITHUB_REF_NAME#v}"
          sdist=(dist/*.tar.gz)
          built="${sdist[0]##*-}"
          built="${built%.tar.gz}"
          echo "tag=$tag packaged=$built"
          test "$tag" = "$built"

      - name: Install the wheel and check the console script
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl
          /tmp/verify/bin/typo-sniper --version
          # Nothing may land in the top-level namespace of site-packages
          for module in config utils cache state exporters scanner notifiers; do
            if /tmp/verify/bin/python -c "import $module" 2>/dev/null; then
              echo "::error::$module leaked into the top-level namespace"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  pypi:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # Trusted Publishing; no stored API token
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # Publishes PEP 740 attestations alongside the distribution by default.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  container:
    name: Container
    needs: build
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/python-docker-release.yml@d5d9556afeeb06f78419b91ecb5d146e789c6d51 # v1.0.0
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}   # optional Service Token fallback; unset means OIDC only
    with:
      dockerfile: docker/Dockerfile
      push: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish == true }}
      tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=semver,pattern={{major}}
        type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      docker-test-command: |
        docker run --rm "$IMAGE" --version
        test "$(docker run --rm --entrypoint id "$IMAGE" -u)" != "0"
      doppler-project: typo-sniper
      doppler-config: ci
      doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
