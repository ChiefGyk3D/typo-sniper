# Publishes on a version tag: a distribution to PyPI and a signed, multi-arch
# container image to GHCR with an SBOM and build provenance.
#
# PyPI publishing uses Trusted Publishing (OIDC) rather than a stored API
# token. The container job is ChiefGyk3D/git-your-ship-together' release workflow:
# cosign keyless signature, syft SPDX SBOM attached as an attestation, and a
# GitHub Artifact Attestation, all from the job's own OIDC identity. There is
# no long-lived credential in this repository's secrets to leak.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish, rather than only building'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Verify the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # A tag that disagrees with the version in the code would publish an
          # artifact nobody can trace back to a commit.
          tag="${GITHUB_REF_NAME#v}"
          built=$(ls dist/*.tar.gz | sed -E 's/.*-([0-9][^-]*)\.tar\.gz/\1/')
          echo "tag=$tag packaged=$built"
          test "$tag" = "$built"

      - name: Install the wheel and check the console script
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl
          /tmp/verify/bin/typo-sniper --version
          # Nothing may land in the top-level namespace of site-packages
          for module in config utils cache state exporters scanner notifiers; do
            if /tmp/verify/bin/python -c "import $module" 2>/dev/null; then
              echo "::error::$module leaked into the top-level namespace"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # Trusted Publishing; no stored API token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  container:
    name: Container
    needs: build
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/python-docker-release.yml@main
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    secrets: inherit
    with:
      dockerfile: docker/Dockerfile
      push: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish == true }}
      tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=semver,pattern={{major}}
        type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      docker-test-command: |
        docker run --rm "$IMAGE" --version
        test "$(docker run --rm --entrypoint id "$IMAGE" -u)" != "0"
      doppler-project: typo-sniper
      doppler-config: ci
      doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
